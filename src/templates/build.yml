name: Build Typst PDF

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Typst
        uses: typst-community/setup-typst@v5

      - name: Build PDF
        run: typst compile main.typ main.pdf

      - name: Rename PDF with commit SHA
        run: mv main.pdf {{BOOK_DIRECTORY}}-${{ github.sha }}.pdf

      - name: Upload PDF preview artifact
        id: upload-pdf
        uses: actions/upload-artifact@v7
        with:
          name: '{{BOOK_DIRECTORY}}-${{ github.sha }}.pdf'
          path: '{{BOOK_DIRECTORY}}-${{ github.sha }}.pdf'
          archive: false

      - name: Add PDF preview to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          ARTIFACT_URL: ${{ steps.upload-pdf.outputs.artifact-url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        with:
          script: |
            const marker = '<!-- pdf-preview -->';
            const headSha = process.env.PR_HEAD_SHA;
            const mergeSha = process.env.MERGE_SHA;

            const body = `${marker}
            ### 📖 PDF Preview

            **[Open PDF preview ↗](${process.env.ARTIFACT_URL})**

            Includes PR commit ${headSha.substring(0, 7)}  
            Built from merge commit ${mergeSha.substring(0, 7)}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComments = comments.filter(
              comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes(marker)
            );

            for (const comment of existingComments) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Create PDF release
        if: >-
          github.event_name == 'push' &&
          (startsWith(github.ref, 'refs/tags/') ||
          (github.ref == 'refs/heads/main' &&
          github.event.before == '0000000000000000000000000000000000000000'))
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.1' }}
          target_commitish: ${{ github.sha }}
          files: '{{BOOK_DIRECTORY}}-${{ github.sha }}.pdf'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
