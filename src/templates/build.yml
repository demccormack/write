name: Build LaTeX PDF

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex

      - name: Rename PDF with commit SHA
        run: mv main.pdf {{BOOK_DIRECTORY}}-${{ github.sha }}.pdf

      - name: Upload PDF preview artifact
        id: upload-pdf
        uses: actions/upload-artifact@v7
        with:
          name: {{BOOK_DIRECTORY}}-${{ github.sha }}.pdf
          path: {{BOOK_DIRECTORY}}-${{ github.sha }}.pdf
          archive: false

      - name: Add PDF preview to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          ARTIFACT_URL: ${{ steps.upload-pdf.outputs.artifact-url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        with:
          script: |
            const marker = '<!-- pdf-preview -->';
            const headSha = process.env.PR_HEAD_SHA;
            const mergeSha = process.env.MERGE_SHA;

            const body = `${marker}
            ### 📖 PDF Preview

            **[Open PDF preview ↗](${process.env.ARTIFACT_URL})**

            Includes PR commit ${headSha.substring(0, 7)}  
            Built from merge commit ${mergeSha.substring(0, 7)}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComments = comments.filter(
              comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes(marker)
            );

            for (const comment of existingComments) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: {{BOOK_DIRECTORY}}-${{ github.sha }}.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
